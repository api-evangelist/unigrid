aid: unigrid
name: Unigrid
description: 'UNIGRID Inc. is a San Diego-based sodium-ion battery company founded in 2021 out of UC
  San Diego Ph.D. research by Dr. Darren H. S. Tan and Dr. Erik A. Wu. Its sodium chromium oxide (NCO)
  chemistry and alloy anode technology deliver fire-safe, fully passive batteries rated for 30,000+
  cycles and -40C to 60C operation, sold as 12V starter batteries (Na+ Fleet), BMS-less rack modules
  (Na+ Module), residential energy storage (Na+ Casa), and DC rack systems for commercial, industrial,
  and data center use (Na+ Cleo). Cells are UN38.3 and UL 9540A certified. Backed by Transition VC,
  Ritz Venture Capital, Union Square Ventures, and Foothill Ventures via an oversubscribed $12M Series
  A (2024); shipped its first sodium-ion residential batteries in July 2026. UNIGRID publishes no
  public API or developer program.'
